<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="RTV – Radio & TV en Direct" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RTV" />
  <!-- GitHub Pages base path -->
  <base href="/rtv/" />
  <title>RTV — En Direct</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <nav id="sidebar">
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">RTV</span>
        <span class="logo-live">LIVE</span>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="all">Tout</button>
        <button class="nav-tab" data-tab="radio">Radio</button>
        <button class="nav-tab" data-tab="tv">TV</button>
        <button class="nav-tab" data-tab="favs">★ Favoris</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Rechercher…" autocomplete="off" />
      </div>
      <div id="channel-list"></div>
      <div class="sidebar-footer">
        <button id="import-btn" class="footer-btn">⬆ Importer M3U</button>
        <input type="file" id="m3u-input" accept=".m3u,.m3u8" hidden />
      </div>
    </nav>

    <!-- MAIN -->
    <main id="main">
      <div id="player-area">
        <div id="player-bg"></div>
        <div id="player-overlay">

          <!-- NOW PLAYING -->
          <div id="now-playing">
            <div id="channel-logo-wrap"><div id="channel-logo"></div></div>
            <div id="channel-meta">
              <div id="channel-name">Sélectionnez une chaîne</div>
              <div id="channel-type-badge"></div>
            </div>
            <button id="fav-btn" title="Favoris">♡</button>
          </div>

          <!-- MEDIA -->
          <div id="media-wrap">
            <video id="video-player" playsinline></video>
            <audio id="audio-player"></audio>

            <div id="player-placeholder">
              <div class="placeholder-icon">▶</div>
              <p>Choisissez une station dans la liste</p>
            </div>

            <div id="loading-spinner" hidden>
              <div class="spinner"></div>
              <span id="loading-msg">Connexion…</span>
            </div>

            <div id="player-error" hidden>
              <span class="error-icon">⚠</span>
              <span id="error-msg">Impossible de lire ce flux</span>
              <button id="retry-btn" class="retry-btn" style="display:none">↺ Réessayer</button>
            </div>

            <!-- BANDEAU AD SKIP -->
            <div id="ad-skip-banner" hidden>
              <div class="ad-skip-inner">
                <span class="ad-skip-icon">🔇</span>
                <span id="ad-skip-counter">Pub détectée…</span>
              </div>
            </div>
          </div>

          <!-- CONTROLS -->
          <div id="controls">
            <button id="play-pause-btn" class="ctrl-btn" disabled>▶</button>
            <div id="volume-wrap">
              <span id="vol-icon">🔊</span>
              <input type="range" id="volume" min="0" max="1" step="0.02" value="0.8" />
            </div>
            <div id="progress-wrap" hidden>
              <div id="progress-bar"><div id="progress-fill"></div></div>
            </div>
            <button id="fullscreen-btn" class="ctrl-btn" title="Plein écran">⛶</button>
            <button id="pip-btn" class="ctrl-btn" title="Picture-in-Picture" hidden>⧉</button>
          </div>
        </div>
      </div>

      <!-- INSTALL BANNER -->
      <div id="install-banner" hidden>
        <span>Installer RTV sur votre appareil</span>
        <button id="install-btn">Installer</button>
        <button id="install-dismiss">✕</button>
      </div>
    </main>
  </div>

  <button id="menu-toggle">☰</button>
  <script src="app.js"></script>
</body>
</html>
